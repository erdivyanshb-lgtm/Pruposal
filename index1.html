<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }
        
        .scene {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .characters {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        .boy, .girl {
            position: absolute;
            bottom: 0;
            transition: all 1s ease;
        }
        
        .boy {
            left: 35%;
            transform: translateX(-50%);
        }
        
        .girl {
            right: 35%;
            transform: translateX(50%);
        }
        
        .boy-body, .girl-body {
            position: relative;
        }
        
        .head {
            width: 60px;
            height: 60px;
            background-color: #ffdbac;
            border-radius: 50%;
            position: relative;
            margin: 0 auto;
            z-index: 2;
        }
        
        .boy-body .body {
            width: 80px;
            height: 120px;
            background-color: #3498db;
            border-radius: 40px 40px 0 0;
            position: relative;
            top: -10px;
        }
        
        .girl-body .body {
            width: 70px;
            height: 130px;
            background-color: #e74c3c;
            border-radius: 35px 35px 0 0;
            position: relative;
            top: -10px;
        }
        
        .leg {
            width: 20px;
            height: 60px;
            background-color: #2c3e50;
            position: absolute;
            bottom: -60px;
        }
        
        .boy-body .leg.left {
            left: 15px;
        }
        
        .boy-body .leg.right {
            right: 15px;
        }
        
        .girl-body .leg.left {
            left: 15px;
            background-color: #2c3e50;
        }
        
        .girl-body .leg.right {
            right: 15px;
            background-color: #2c3e50;
        }
        
        .arm {
            width: 20px;
            height: 80px;
            background-color: #ffdbac;
            position: absolute;
            top: 20px;
            transform-origin: top center;
        }
        
        .boy-body .arm.left {
            left: -10px;
            transform: rotate(20deg);
        }
        
        .boy-body .arm.right {
            right: -10px;
            transform: rotate(-20deg);
        }
        
        .girl-body .arm.left {
            left: -10px;
            transform: rotate(10deg);
        }
        
        .girl-body .arm.right {
            right: -10px;
            transform: rotate(-10deg);
        }
        
        .proposal-box {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            animation: pulse 2s infinite;
        }
        
        .proposal-text {
            font-size: 24px;
            margin-bottom: 15px;
            color: #e74c3c;
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        button {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .yes-btn {
            background-color: #2ecc71;
            color: white;
        }
        
        .no-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        button:hover {
            transform: scale(1.1);
        }
        
        .hidden {
            display: none;
        }
        
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff6b6b;
            transform: rotate(45deg);
            opacity: 0;
        }
        
        .heart:before, .heart:after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: #ff6b6b;
            border-radius: 50%;
            position: absolute;
        }
        
        .heart:before {
            top: -10px;
            left: 0;
        }
        
        .heart:after {
            top: 0;
            left: -10px;
        }
        
        .tear {
            position: absolute;
            width: 5px;
            height: 10px;
            background-color: #3498db;
            border-radius: 0 0 5px 5px;
            opacity: 0;
        }
        
        .message {
            position: absolute;
            top: 20%;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes hug {
            0% { transform: translateX(0); }
            50% { transform: translateX(50px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes cry {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(-100px) rotate(20deg); opacity: 0; }
        }
        
        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="proposal-box">
            <div class="proposal-text">Will you be my partner for some more time?</div>
            <div class="buttons">
                <button class="yes-btn">Yes</button>
                <button class="no-btn">No</button>
            </div>
        </div>
        
        <div class="characters">
            <div class="boy">
                <div class="boy-body">
                    <div class="head"></div>
                    <div class="body">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>
            
            <div class="girl">
                <div class="girl-body">
                    <div class="head"></div>
                    <div class="body">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>
        </div>
        
        <div class="hearts" id="hearts"></div>
        
        <div class="message" id="happy-message">Yay! They lived happily ever after! ❤️</div>
        <div class="message" id="sad-message">Maybe next time... 💔</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yesBtn = document.querySelector('.yes-btn');
            const noBtn = document.querySelector('.no-btn');
            const proposalBox = document.querySelector('.proposal-box');
            const boy = document.querySelector('.boy');
            const girl = document.querySelector('.girl');
            const heartsContainer = document.getElementById('hearts');
            const happyMessage = document.getElementById('happy-message');
            const sadMessage = document.getElementById('sad-message');
            
            // Yes button click - happy scenario
            yesBtn.addEventListener('click', function() {
                // Hide proposal box
                proposalBox.classList.add('hidden');
                
                // Move characters closer together
                boy.style.transform = 'translateX(50px)';
                girl.style.transform = 'translateX(-50px)';
                
                // Create hugging animation
                setTimeout(() => {
                    boy.style.animation = 'hug 1s ease-in-out';
                    girl.style.animation = 'hug 1s ease-in-out';
                    
                    // Create hearts animation
                    createHearts();
                    
                    // Show happy message
                    setTimeout(() => {
                        happyMessage.style.opacity = '1';
                    }, 1500);
                }, 500);
            });
            
            // No button click - sad scenario
            noBtn.addEventListener('click', function() {
                // Hide proposal box
                proposalBox.classList.add('hidden');
                
                // Move characters apart
                boy.style.transform = 'translateX(-30px)';
                girl.style.transform = 'translateX(30px)';
                
                // Create crying animation
                setTimeout(() => {
                    boy.style.animation = 'cry 0.5s ease-in-out infinite';
                    
                    // Create tears
                    createTears();
                    
                    // Show sad message
                    setTimeout(() => {
                        sadMessage.style.opacity = '1';
                    }, 1500);
                }, 500);
            });
            
            // Function to create floating hearts
            function createHearts() {
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.classList.add('heart');
                        
                        // Random position at the bottom
                        const startX = Math.random() * 100;
                        heart.style.left = `${startX}%`;
                        heart.style.bottom = '0';
                        
                        // Random size
                        const size = 10 + Math.random() * 20;
                        heart.style.width = `${size}px`;
                        heart.style.height = `${size}px`;
                        
                        heartsContainer.appendChild(heart);
                        
                        // Animate the heart
                        setTimeout(() => {
                            heart.style.animation = `float ${2 + Math.random() * 2}s forwards`;
                        }, 10);
                        
                        // Remove heart after animation
                        setTimeout(() => {
                            heart.remove();
                        }, 4000);
                    }, i * 200);
                }
            }
            
            // Function to create falling tears
            function createTears() {
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const tear = document.createElement('div');
                        tear.classList.add('tear');
                        
                        // Position tears from boy's eyes
                        tear.style.left = `${35 + Math.random() * 10}%`;
                        tear.style.top = '30%';
                        
                        document.querySelector('.scene').appendChild(tear);
                        
                        // Animate the tear
                        setTimeout(() => {
                            tear.style.animation = `fall ${1 + Math.random()}s forwards`;
                        }, 10);
                        
                        // Remove tear after animation
                        setTimeout(() => {
                            tear.remove();
                        }, 2000);
                    }, i * 300);
                }
            }
        });
    </script>
</body>
</html>
