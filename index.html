<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .proposal-box {
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            animation: pulse 2s infinite;
            z-index: 10;
            position: relative;
        }
        
        .proposal-text {
            font-size: 32px;
            margin-bottom: 25px;
            color: #e74c3c;
            font-weight: bold;
        }
        
        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        
        button {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .yes-btn {
            background: linear-gradient(to right, #2ecc71, #1abc9c);
            color: white;
        }
        
        .no-btn {
            background: linear-gradient(to right, #e74c3c, #c0392b);
            color: white;
        }
        
        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .scene {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        .boy, .girl {
            position: absolute;
            bottom: 0;
            transition: all 1.5s ease;
        }
        
        .boy {
            left: 35%;
            transform: translateX(-50%);
        }
        
        .girl {
            right: 35%;
            transform: translateX(50%);
        }
        
        .boy-body, .girl-body {
            position: relative;
        }
        
        .head {
            width: 70px;
            height: 70px;
            background-color: #ffdbac;
            border-radius: 50%;
            position: relative;
            margin: 0 auto;
            z-index: 2;
            border: 2px solid #e0b88f;
        }
        
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .eye {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #333;
            border-radius: 50%;
            top: 25px;
        }
        
        .boy .eye.left {
            left: 20px;
        }
        
        .boy .eye.right {
            right: 20px;
        }
        
        .girl .eye.left {
            left: 20px;
        }
        
        .girl .eye.right {
            right: 20px;
        }
        
        .mouth {
            position: absolute;
            width: 30px;
            height: 10px;
            border-radius: 0 0 15px 15px;
            background-color: #e75480;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .boy-body .body {
            width: 90px;
            height: 130px;
            background: linear-gradient(to bottom, #3498db, #2980b9);
            border-radius: 45px 45px 0 0;
            position: relative;
            top: -15px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .girl-body .body {
            width: 80px;
            height: 140px;
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            border-radius: 40px 40px 0 0;
            position: relative;
            top: -15px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .leg {
            width: 25px;
            height: 70px;
            background-color: #2c3e50;
            position: absolute;
            bottom: -70px;
        }
        
        .boy-body .leg.left {
            left: 15px;
        }
        
        .boy-body .leg.right {
            right: 15px;
        }
        
        .girl-body .leg.left {
            left: 15px;
            background-color: #2c3e50;
        }
        
        .girl-body .leg.right {
            right: 15px;
            background-color: #2c3e50;
        }
        
        .arm {
            width: 25px;
            height: 90px;
            background-color: #ffdbac;
            position: absolute;
            top: 20px;
            transform-origin: top center;
            border-radius: 12px;
        }
        
        .boy-body .arm.left {
            left: -15px;
            transform: rotate(20deg);
        }
        
        .boy-body .arm.right {
            right: -15px;
            transform: rotate(-20deg);
        }
        
        .girl-body .arm.left {
            left: -15px;
            transform: rotate(10deg);
        }
        
        .girl-body .arm.right {
            right: -15px;
            transform: rotate(-10deg);
        }
        
        .hidden {
            display: none;
        }
        
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #ff6b6b;
            transform: rotate(45deg);
            opacity: 0;
        }
        
        .heart:before, .heart:after {
            content: '';
            width: 30px;
            height: 30px;
            background-color: #ff6b6b;
            border-radius: 50%;
            position: absolute;
        }
        
        .heart:before {
            top: -15px;
            left: 0;
        }
        
        .heart:after {
            top: 0;
            left: -15px;
        }
        
        .tear {
            position: absolute;
            width: 8px;
            height: 15px;
            background: linear-gradient(to bottom, #3498db, #2980b9);
            border-radius: 0 0 8px 8px;
            opacity: 0;
        }
        
        .message {
            position: absolute;
            top: 15%;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }
        
        .ring {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, #ffd700, #ffa500);
            border-radius: 50%;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px gold;
            opacity: 0;
            z-index: 3;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes hug {
            0% { transform: translateX(0); }
            50% { transform: translateX(50px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes cry {
            0% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-10px) rotate(-5deg); }
            50% { transform: translateY(0) rotate(0); }
            75% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0); }
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(-150px) rotate(20deg); opacity: 0; }
        }
        
        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(80px); opacity: 0; }
        }
        
        @keyframes ring-glow {
            0% { box-shadow: 0 0 5px gold; }
            50% { box-shadow: 0 0 20px gold; }
            100% { box-shadow: 0 0 5px gold; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="proposal-box" id="proposal-box">
            <div class="proposal-text">Will you marry me?</div>
            <div class="buttons">
                <button class="yes-btn" id="yes-btn">Yes!</button>
                <button class="no-btn" id="no-btn">No</button>
            </div>
        </div>
        
        <div class="scene">
            <div class="boy" id="boy">
                <div class="boy-body">
                    <div class="head">
                        <div class="face">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="body">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                        <div class="ring" id="ring"></div>
                    </div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>
            
            <div class="girl" id="girl">
                <div class="girl-body">
                    <div class="head">
                        <div class="face">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="body">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>
        </div>
        
        <div class="hearts" id="hearts"></div>
        
        <div class="message" id="happy-message">Yay! They lived happily ever after! ❤️</div>
        <div class="message" id="sad-message">Maybe next time... 💔</div>
    </div>

    <script>
        // Wait for the DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded - initializing buttons");
            
            // Get all elements
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const proposalBox = document.getElementById('proposal-box');
            const boy = document.getElementById('boy');
            const girl = document.getElementById('girl');
            const heartsContainer = document.getElementById('hearts');
            const happyMessage = document.getElementById('happy-message');
            const sadMessage = document.getElementById('sad-message');
            const ring = document.getElementById('ring');
            
            // Make the ring visible
            ring.style.opacity = '1';
            ring.style.animation = 'ring-glow 2s infinite';
            
            // Add click event listeners with proper error handling
            if (yesBtn) {
                yesBtn.addEventListener('click', handleYesClick);
                console.log("Yes button event listener added");
            } else {
                console.error("Yes button not found!");
            }
            
            if (noBtn) {
                noBtn.addEventListener('click', handleNoClick);
                console.log("No button event listener added");
            } else {
                console.error("No button not found!");
            }
            
            // Yes button handler
            function handleYesClick() {
                console.log("Yes button clicked");
                
                // Hide proposal box
                if (proposalBox) {
                    proposalBox.classList.add('hidden');
                }
                
                // Move characters closer together
                if (boy) boy.style.transform = 'translateX(50px)';
                if (girl) girl.style.transform = 'translateX(-50px)';
                
                // Create hugging animation
                setTimeout(() => {
                    if (boy) boy.style.animation = 'hug 1.5s ease-in-out 2';
                    if (girl) girl.style.animation = 'hug 1.5s ease-in-out 2';
                    
                    // Create hearts animation
                    createHearts();
                    
                    // Show happy message
                    setTimeout(() => {
                        if (happyMessage) happyMessage.style.opacity = '1';
                    }, 2000);
                }, 800);
            }
            
            // No button handler
            function handleNoClick() {
                console.log("No button clicked");
                
                // Hide proposal box
                if (proposalBox) {
                    proposalBox.classList.add('hidden');
                }
                
                // Move characters apart
                if (boy) boy.style.transform = 'translateX(-50px)';
                if (girl) girl.style.transform = 'translateX(50px)';
                
                // Create crying animation
                setTimeout(() => {
                    if (boy) boy.style.animation = 'cry 1s ease-in-out infinite';
                    
                    // Create tears
                    createTears();
                    
                    // Show sad message
                    setTimeout(() => {
                        if (sadMessage) sadMessage.style.opacity = '1';
                    }, 2000);
                }, 800);
            }
            
            // Function to create floating hearts
            function createHearts() {
                if (!heartsContainer) return;
                
                for (let i = 0; i < 25; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.classList.add('heart');
                        
                        // Random position at the bottom
                        const startX = 30 + Math.random() * 40;
                        heart.style.left = `${startX}%`;
                        heart.style.bottom = '0';
                        
                        // Random size
                        const size = 15 + Math.random() * 25;
                        heart.style.width = `${size}px`;
                        heart.style.height = `${size}px`;
                        
                        // Random color
                        const colors = ['#ff6b6b', '#ff8e8e', '#ff5252', '#ff3838'];
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        heart.style.backgroundColor = color;
                        
                        heartsContainer.appendChild(heart);
                        
                        // Animate the heart
                        setTimeout(() => {
                            heart.style.animation = `float ${3 + Math.random() * 2}s forwards`;
                        }, 10);
                        
                        // Remove heart after animation
                        setTimeout(() => {
                            if (heart.parentNode) {
                                heart.parentNode.removeChild(heart);
                            }
                        }, 5000);
                    }, i * 200);
                }
            }
            
            // Function to create falling tears
            function createTears() {
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        const tear = document.createElement('div');
                        tear.classList.add('tear');
                        
                        // Position tears from boy's eyes
                        const eyePosition = 35 + Math.random() * 10;
                        tear.style.left = `${eyePosition}%`;
                        tear.style.top = '30%';
                        
                        document.querySelector('.container').appendChild(tear);
                        
                        // Animate the tear
                        setTimeout(() => {
                            tear.style.animation = `fall ${1 + Math.random()}s forwards`;
                        }, 10);
                        
                        // Remove tear after animation
                        setTimeout(() => {
                            if (tear.parentNode) {
                                tear.parentNode.removeChild(tear);
                            }
                        }, 2000);
                    }, i * 300);
                }
            }
        });
    </script>
</body>
    </html>
